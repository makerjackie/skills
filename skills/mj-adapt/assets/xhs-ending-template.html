<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XH-Ending-Template</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --fg: #000000;
            --accent: #000000;
            --border: 3px solid #000;
            --pad: 2.5rem;
            --font-main: 'Noto Sans SC', 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0 !important; }

        body {
            background: #e5e5e5;
            font-family: var(--font-main);
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .slide {
            width: 100%;
            max-width: 621px; /* 1242 / 2 */
            aspect-ratio: 3/4; 
            background: var(--bg);
            color: var(--fg);
            border: var(--border);
            padding: var(--pad);
            padding-top: 5rem;
            position: relative;
            box-shadow: 12px 12px 0px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header Style */
        .header-path {
            position: absolute;
            top: var(--pad);
            left: var(--pad);
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 1.1rem;
            color: #000;
            border-bottom: 3px solid #000; 
            padding-bottom: 8px;
            z-index: 10;
        }
        
        .path-highlight {
            background: #000;
            color: #fff;
            padding: 2px 8px;
        }

        .header-path .slash {
            color: #999;
        }

        /* Content Area */
        .outro-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 100%;
            margin-bottom: 2rem;
        }

        .outro-sub {
            font-size: 2.5rem;
            font-weight: 900;
            color: #666;
            margin-bottom: 0.5rem;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }

        .outro-main {
            font-size: 4rem;
            font-weight: 900;
            color: #000;
            line-height: 1.1;
            letter-spacing: -0.03em;
        }

        .philosophy-section {
            margin-top: 3rem;
        }

        .philosophy-title {
            color: #000;
            margin-bottom: 12px;
            font-weight: 900;
            font-size: 1.2rem;
        }

        .philosophy-item {
            color: #333;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .philosophy-item span {
            color: #000;
        }

        /* Footer: Profile + CTA */
        .profile-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto; 
            margin-bottom: 2rem;
            border-top: 1px solid #eee;
            padding-top: 2rem;
            width: 100%;
        }

        .avatar-group {
            display: flex;
            align-items: center;
            gap: 16px; 
        }
        
        .avatar-img-large {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #000;
            object-fit: cover;
            background: #eee;
        }

        .profile-info p:first-child {
            margin: 0;
            font-weight: 900;
            font-size: 1.5rem;
            color: #000;
        }

        .profile-info p:last-child {
            margin: 0;
            font-size: 1rem;
            color: #666;
        }

        .cta-group {
            text-align: right;
            max-width: 60%;
        }
        
        .cta-label {
            font-size: 0.9rem;
            color: #999;
            margin-bottom: 4px;
            font-family: var(--font-mono);
            font-weight: 700;
        }
        
        .cta-action {
            font-size: 1.2rem; 
            font-weight: 900;
            color: #000;
            border-bottom: 2px solid #000;
            padding-bottom: 2px;
            line-height: 1.4;
        }

    </style>
</head>
<body>

    <div class="slide">
        <!-- Header -->
        <div class="header-path">
            <span>{{BRAND_IDENTIFIER}}</span>
            <span class="slash">/</span>
            <span class="path-highlight">{{PRIMARY_CONTEXT}}</span>
            <span class="slash">/</span>
            <span>END</span>
        </div>
        
        <!-- Content Area -->
        <div class="outro-container">
            <div class="outro-sub">
                {{ENDING_KICKER}}
            </div>
            <div class="outro-main">
                {{ENDING_HEADLINE_LINE_1}}<br>
                {{ENDING_HEADLINE_LINE_2}}
            </div>

            <div class="philosophy-section">
                <div class="philosophy-title">{{PRIMARY_TITLE}}</div>
                <div class="philosophy-item"><span>√</span> {{PRIMARY_POINT_1}}</div>
                <div class="philosophy-item"><span>√</span> {{PRIMARY_POINT_2}}</div>
                <div class="philosophy-item"><span>√</span> {{PRIMARY_POINT_3}}</div>
            </div>
        </div>

        <!-- Footer -->
        <div class="profile-section">
            <div class="avatar-group">
                <img src="assets/jackie-avatar.jpg" class="avatar-img-large" alt="Author">
                <div class="profile-info">
                     <p>{{AUTHOR_NAME}}</p>
                     <p>{{BRAND_SLOGAN}}</p>
                </div>
            </div>

            <div class="cta-group">
                <p class="cta-label">MORE ON</p>
                <div class="cta-action">{{PRIMARY_CTA_LINE_1}}<br>{{PRIMARY_CTA_LINE_2}}</div>
            </div>
        </div>
    </div>

</body>
</html>
